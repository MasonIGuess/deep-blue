<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Brand | Deep Blue</title>

  <!-- Fonts from Google Fonts: Jaini Purva (headings) and Libre Franklin (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jaini+Purva&family=Libre+Franklin&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header: home button + main navigation (same on every page) -->
  <header class="header">
    <a class="home-link" href="index.html">
      <img class="home-button" src="images/home-button.png" alt="Deep Blue home">
    </a>
    <nav>
      <ul class="nav-list">
        <li><a class="nav-link" href="tickets.html">Tickets</a></li>
        <li><a class="nav-link" href="brand.html">Brand</a></li>
        <li><a class="nav-link" href="sets.html">Sets</a></li>
        <li><a class="nav-link" href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article>

      <section class="title-band">
        <h1 class="big-heading">The Brand</h1>
        <p class="title-text">Explore the branding behind your new favorite festival...</p>
      </section>

      <!-- Color palette -->
      <section>
        <div class="palette-label">
          <h2 class="big-heading">The Palette</h2>
        </div>
        <ul class="palette">
          <li class="swatch">
            <div class="swatch-color swatch-primary"></div>
            <p>Primary</p>
            <p>#1D2B6C</p>
          </li>
          <li class="swatch">
            <div class="swatch-color swatch-secondary"></div>
            <p>Secondary</p>
            <p>#181E35</p>
          </li>
          <li class="swatch">
            <div class="swatch-color swatch-accent"></div>
            <p>Accent</p>
            <p>#8F9BD0</p>
          </li>
          <li class="swatch">
            <div class="swatch-color swatch-accent-two"></div>
            <p>Accent 2</p>
            <p>#6EA2DD</p>
          </li>
        </ul>
      </section>

      <!-- Logo -->
      <section>
        <div class="section-band">
          <h2 class="big-heading">The Logo</h2>
        </div>
        <div class="brand-logo-area">
          <div class="brand-logo-circle">
            <img class="logo" src="images/ray.png" alt="Deep Blue logo: a manta ray between the words Deep and Blue">
          </div>
        </div>
      </section>

      <!-- Extra artwork -->
      <section>
        <div class="section-band">
          <h2 class="big-heading">Additional Media</h2>
        </div>
        <div class="media">
          <img class="media-image" src="images/artboard-17.png" alt="Octopus in a diving helmet above the words Deep Blue">
          <img class="media-image" src="images/artboard-19.png" alt="Blue manta ray beside gold Deep Blue lettering">
          <img class="media-image" src="images/artboard-9.png" alt="Black manta ray with stacked Deep Blue lettering">
          <img class="media-image" src="images/octo.png" alt="Black octopus in a diving helmet with outlined Deep Blue lettering">
        </div>
      </section>

    </article>

  </main>

  <footer class="footer">
    <img class="footer-image" src="images/ray.png" alt="Deep Blue ray graphic">
  </footer>

</body>
</html>
